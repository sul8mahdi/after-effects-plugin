<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon M Pro</title>
  <link rel="stylesheet" href="./css/panel.css">
  <link rel="stylesheet" href="./css/rtl.css">
</head>
<body class="rtl">
  <!-- Diagnostic banner: shows any script error on-screen so it can be seen
       without Chrome remote debugging. Must be the first script so it catches
       errors thrown by the scripts loaded at the end of the body. -->
  <script>
    (function () {
      function banner() {
        var d = document.getElementById('bootErr');
        if (!d) {
          d = document.createElement('div');
          d.id = 'bootErr';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;max-height:45%;overflow:auto;'
            + 'background:#7a1f1f;color:#fff;font:11px/1.4 monospace;padding:8px;z-index:99999;white-space:pre-wrap;direction:ltr;text-align:left';
          (document.body || document.documentElement).appendChild(d);
        }
        return d;
      }
      window.addEventListener('error', function (e) {
        banner().textContent += 'ERROR: ' + (e.message || e.type)
          + '  @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + '\n';
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e.reason && e.reason.message ? e.reason.message : String(e.reason));
        // Benign CEF-internal storage attempts in the sandboxed panel — not ours.
        if (/permission denied|quota|storage|localStorage|IndexedDB/i.test(msg)) { return; }
        banner().textContent += 'PROMISE: ' + msg + '\n';
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var loaded = !!(window.IMPLocales && window.IMPLocales.ar);
          var cep = !!(window.__adobe_cep__);
          var booted = document.getElementById('appTagline') && document.getElementById('appTagline').textContent.length > 0;
          if (!booted) {
            banner().textContent += 'DIAG: IMPLocales=' + loaded + '  __adobe_cep__=' + cep
              + '  IMPBridge=' + (!!window.IMPBridge) + '  IMPi18n=' + (!!window.IMPi18n) + '\n';
          }
        }, 800);
      });
    })();
  </script>
  <header class="topbar">
    <div class="brand">
      <h1 id="appTitle">Icon M Pro</h1>
      <p id="appTagline" class="tagline"></p>
    </div>
    <div class="topbar-actions">
      <span id="phaseBadge" class="badge phase"></span>
      <button id="langToggle" class="lang-toggle" type="button">English</button>
    </div>
  </header>

  <span id="mockBadge" class="badge mock" style="display:none"></span>

  <main class="content">
    <section class="steps">
      <div class="step" id="step1"></div>
      <div class="step" id="step2"></div>
      <div class="step" id="step3"></div>
      <p class="hint" id="selectHint"></p>
    </section>

    <section class="actions">
      <button id="btnAnalyze" class="btn primary" type="button"></button>
      <button id="btnAnimate" class="btn" type="button" disabled title="Phase 3"></button>
    </section>

    <div id="errorBox" class="error-box" style="display:none">
      <span class="msg"></span>
    </div>

    <section id="report" class="report"></section>

    <p id="phaseNote" class="phase-note"></p>
  </main>

  <footer class="statusbar">
    <span id="status" class="status"></span>
    <button id="btnCopyLog" class="btn ghost small" type="button"></button>
  </footer>

  <script src="./locale/locales.js"></script>
  <script src="./js/csinterface.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/log.js"></script>
  <script src="./js/bridge.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
